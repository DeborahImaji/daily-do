<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="Daily Do is a cute to-do list web app where you can sort tasks by due date and monitor your progress">
    	<meta name="keywords" content="Daily Do, to-do list app, task management">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

		<title>Daily Do</title>

    <!-- PRELOADED CONTENT -->
    <link rel="preload" href="home-bg.jpg" as="image">

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

    <!-- BRAND -->
    <header class="header">
      <h1 class="heading1">Daily Do</h1>
    </header>

    <main>
      <!-- PROGRESS BAR -->
      <section class="progress-section">
        <h3 class="heading3">Your Progress</h3>
        <div class="progress-bar-body">
          <div class="progress-bar"></div>
        </div>
        <span></span>
      </section>

      <!-- ADD TASKS -->
      <section>
        <form>
          <div>
            <input type="text" placeholder="What do you need to do?" required autocomplete="off">
            <input type="date" required>
          </div>
          <button type="submit">Add Task</button>
        </form>
      </section>

      <!-- ALL TASKS -->
      <section>
        <h2>All Tasks</h2>
        <section></section>
      </section>
    </main>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
