<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="Cute sly blue themed to-do list web app">
    	<meta name="keywords" content="DailyDo, tasklist, productivity">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
    <link rel="icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">

		<title>Daily Do</title>

    <!-- PRELOADED CONTENT -->
    <link rel="preload" href="background.png" as="image">

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

    <!-- BRAND -->
    <header class="header">
      <h1 class="heading1">Daily Do</h1>
    </header>

    <main>
      <!-- PROGRESS BAR -->
      <section class="progress-section">
        <h3 class="progress-percent" id="progressPercent"></h3>
        <div class="progress-bar-body">
          <div class="progress-bar" id="progressBarFill"></div>
        </div>
        <span></span>
      </section>

      <!-- ADD TASKS -->
      <section class="add-section">
        <form class="add-task-form" id="addTaskForm">
          <div class="add-task-inputs">
            <input type="text" placeholder="What do you need to do?" required autocomplete="off" class="add-task-name" id="addTaskInput">
            <input type="date" required class="add-task-date" id="addDateInput">
          </div>
          <button type="submit" class="add-task-submit">Add Task</button>
        </form>
      </section>

      <!-- ALL TASKS -->
      <section class="task-list-section">
        <h2 class="heading2">All Tasks</h2>
        <section id="taskListContainer" class="task-list-container"></section>
      </section>

      <button id="clearCompletedBtn" class="clear-completed-btn">Clear Completed</button>
    </main>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
